# Render Blueprint for the hosted demo. NOT applied: deploying needs the user's approval
# (Starter plan ~$7/mo, prorated; see docs/DEPLOY.md for the exact steps).
services:
  - type: web
    name: dispute-defender
    runtime: node
    plan: starter            # free also works but sleeps after 15 min idle (~1 min cold start for judges)
    region: oregon
    branch: main
    autoDeploy: false
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: PAYPAL_ENV
        value: sandbox
      - key: DD_MODE
        value: replay        # public demo = recorded sandbox data; nothing is written to PayPal
      - key: DD_PUBLIC_DEMO
        value: "1"
      - key: DD_LLM
        value: claude        # only for the capped "Fresh draft with live AI" button; recorded drafts are $0
      - key: LLM_MAX_CALLS_PER_DAY
        value: "40"
      - key: DD_DB_PATH
        value: /tmp/dispute-defender.db   # ephemeral by design: the store rebuilds from PayPal + fixtures
      - key: PAYPAL_CLIENT_ID
        sync: false          # secret: entered by the user in the Render dashboard
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: CLAUDE_API_KEY
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false          # after registering the webhook in the PayPal developer dashboard (by hand)
